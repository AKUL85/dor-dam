# Alembic configuration. Read in scripts/db/alembic/env.py.
# Database URL is taken from the DORDAM_DB_URL env var (same as the
# importer / models) so the migration runner doesn't need its own copy.

[alembic]
script_location = db/alembic
prepend_sys_path = .
sqlalchemy.url = sqlite:///./processed/dordam.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S